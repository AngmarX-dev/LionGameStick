name: Graphics stack audit

on:
  push:
    branches:
      - recovery/05-rockchip-graphics-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-graphics-audit:
    name: Validate scripts and inspect repository binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ELF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils
      - name: Compile audit scripts
        run: |
          python -m py_compile scripts/audit-graphics-stack.py
          python -m py_compile scripts/analyze-elf-duplicates.py
          python -m py_compile scripts/audit-all-binaries.py
      - name: Run fixture tests
        run: python -m unittest discover -s tests -v
      - name: Check command-line help
        run: |
          python scripts/audit-graphics-stack.py --help
          python scripts/analyze-elf-duplicates.py --help
          python scripts/audit-all-binaries.py --help
      - name: Inventory graphics stack
        run: |
          python scripts/audit-graphics-stack.py . --output "$RUNNER_TEMP/graphics-stack-audit.csv"
          python scripts/analyze-elf-duplicates.py "$RUNNER_TEMP/graphics-stack-audit.csv" --output "$RUNNER_TEMP/elf-duplicate-audit.json"
      - name: Inventory all binary-like files and inspect ELF metadata
        run: |
          python scripts/audit-all-binaries.py . --csv "$RUNNER_TEMP/binary-inventory.csv" --json "$RUNNER_TEMP/elf-deep-analysis.json"
      - name: Upload binary analysis
        uses: actions/upload-artifact@v4
        with:
          name: complete-binary-analysis
          path: |
            ${{ runner.temp }}/graphics-stack-audit.csv
            ${{ runner.temp }}/elf-duplicate-audit.json
            ${{ runner.temp }}/binary-inventory.csv
            ${{ runner.temp }}/elf-deep-analysis.json
          if-no-files-found: error
          retention-days: 14
