name: Graphics stack audit

on:
  push:
    branches:
      - recovery/05-rockchip-graphics-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-graphics-audit:
    name: Python syntax, fixture tests and repository inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ELF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils
      - name: Compile audit script
        run: python -m py_compile scripts/audit-graphics-stack.py
      - name: Run fixture tests
        run: python -m unittest discover -s tests -v
      - name: Check command-line help
        run: python scripts/audit-graphics-stack.py --help
      - name: Inventory repository graphics binaries
        run: |
          python scripts/audit-graphics-stack.py . --output "$RUNNER_TEMP/graphics-stack-audit.csv"
      - name: Upload graphics inventory
        uses: actions/upload-artifact@v4
        with:
          name: graphics-stack-audit
          path: ${{ runner.temp }}/graphics-stack-audit.csv
          if-no-files-found: error
          retention-days: 14
